version: '3.8'
services:
  rag:
    build:
      context: ../../..
      dockerfile: deployment/docker/rag/Dockerfile
    container_name: pdf-autofillr-rag
    ports:
      - "8000:8000"
    env_file: .env
    volumes:
      - ./data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
