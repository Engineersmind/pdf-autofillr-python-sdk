[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-autofillr-rag"
version = "0.2.3"
description = "Self-learning RAG field prediction SDK for PDF form filling."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["rag", "pdf", "form-filling", "embeddings", "nlp", "field-prediction"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.24.0",
    "scikit-learn>=1.4.0",
    "python-dotenv>=1.0.0",
    "pydantic-settings>=2.0.0",
    "python-dateutil>=2.8.2",
]

[project.optional-dependencies]
transformers = ["sentence-transformers>=2.3.1", "torch>=2.0.0"]
openai       = ["openai>=1.51.0",    "httpx>=0.27.0"]
anthropic    = ["anthropic>=0.34.0", "httpx>=0.27.0"]
litellm      = ["litellm>=1.59.0"]
s3           = ["boto3>=1.35.0",  "botocore>=1.35.0"]
azure        = ["azure-storage-blob>=12.0.0", "azure-identity>=1.0.0"]
gcs          = ["google-cloud-storage>=2.0.0"]
pinecone     = ["pinecone-client>=3.0.0"]
chroma       = ["chromadb>=0.4.0"]
weaviate     = ["weaviate-client>=4.0.0"]
server       = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0"]
azure_func   = ["azure-functions>=1.0.0"]
gcp_func     = ["functions-framework>=3.0.0"]
all          = [
    "sentence-transformers>=2.3.1", "torch>=2.0.0",
    "openai>=1.51.0", "httpx>=0.27.0",
    "anthropic>=0.34.0",
    "litellm>=1.59.0",
    "boto3>=1.35.0", "botocore>=1.35.0",
    "azure-storage-blob>=12.0.0", "azure-identity>=1.0.0",
    "google-cloud-storage>=2.0.0",
    "fastapi>=0.100.0", "uvicorn[standard]>=0.20.0",
]
dev = ["pytest>=7.0", "pytest-asyncio", "pytest-cov", "black", "ruff", "mypy"]

[project.scripts]
ragpdf        = "ragpdf.entrypoints.cli:main"
ragpdf-server = "ragpdf.entrypoints.fastapi_app:main"
ragpdf-setup  = "ragpdf.entrypoints.setup:main"

[project.urls]
Homepage      = "https://github.com/yourorg/pdf-autofillr-rag"
Documentation = "https://docs.ragpdf.io"
Repository    = "https://github.com/yourorg/pdf-autofillr-rag"

[tool.hatch.build.targets.wheel]
packages = ["src/ragpdf"]

[tool.hatch.build.targets.sdist.force-include]
"src/ragpdf/data" = "src/ragpdf/data"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers   = ["integration: requires real API keys", "slow: slow tests"]

[tool.ruff]
line-length    = 100
target-version = "py310"