[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pdf-autofillr-mapper"
version = "1.0.10"
description = "PDF field extraction, semantic mapping, embedding and filling engine"
readme = "README.md"
authors = [{name = "Engineersmind", email = "team@engineersmind.com"}]
license = {text = "MIT"}
requires-python = ">=3.9"
keywords = ["pdf", "form-filling", "llm", "mapping", "extraction", "embedding"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "PyMuPDF>=1.23.0",
    "litellm>=1.30.0",
    "tiktoken>=0.5.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.2.0",
    "requests>=2.31.0",
    "aiohttp>=3.9.0",
    "httpx>=0.26.0",
    "numpy>=1.24.0",
    "tqdm>=4.66.0",
    "python-json-logger>=2.0.0",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "python-multipart>=0.0.6",
]
aws = [
    "boto3>=1.34.34",
    "botocore>=1.34.34",
]
azure = [
    "azure-storage-blob>=12.19.0",
    "azure-identity>=1.15.0",
    "azure-functions>=1.18.0",
]
gcp = [
    "google-cloud-storage>=2.14.0",
    "functions-framework>=3.5.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.12.0",
    "black>=23.12.0",
    "flake8>=7.0.0",
    "ruff>=0.4.0",
    "mypy>=1.8.0",
]
all = ["pdf-autofillr-mapper[api,aws,azure,gcp]"]

[project.urls]
Homepage = "https://github.com/Engineersmind/pdf-autofillr"
Repository = "https://github.com/Engineersmind/pdf-autofillr"

[project.scripts]
pdf-mapper-server = "pdf_autofillr_mapper.entrypoints.server:main"
pdf-mapper        = "pdf_autofillr_mapper.entrypoints.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["pdf_autofillr_mapper*"]

[tool.setuptools.package-data]
"pdf_autofillr_mapper" = [
    "java_utils/**/*.jar",
    "config_samples/**",
    "config_samples/.env.mapper.example",
]

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = ["-v", "--tb=short"]
asyncio_mode = "auto"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
check_untyped_defs = true
no_implicit_optional = true

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]