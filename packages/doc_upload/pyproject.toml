# extractor/pyproject.toml
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-autofillr-doc-upload"
version = "0.1.5"
description = "Document extraction pipeline — extract structured data from PDF/DOCX/PPTX/XLSX/JSON/CSV/MD and fill PDFs via the mapper module"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "litellm>=1.30.0",
    "python-dotenv>=1.0.0",
    "requests>=2.31.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyMuPDF>=1.23.0",
    "python-docx>=1.1.0",
    "python-pptx>=0.6.21",
    "openpyxl>=3.1.0",
    "pdf-autofillr-mapper>=1.0.0",
]

[project.optional-dependencies]
server  = ["fastapi>=0.100.0", "uvicorn[standard]>=0.20.0", "python-multipart>=0.0.6"]
s3      = ["boto3>=1.35.0"]
gcp     = ["google-cloud-storage>=2.14.0"]
azure   = ["azure-storage-blob>=12.19.0", "azure-identity>=1.15.0"]
dev     = [
    "pytest>=7.0", "pytest-asyncio>=0.21", "pytest-cov>=4.0",
    "black>=24.0", "ruff>=0.4.0", "mypy>=1.8",
    "httpx>=0.24.0", "fastapi>=0.100.0", "uvicorn[standard]>=0.20.0",
]
full = [
    "fastapi>=0.100.0", "uvicorn[standard]>=0.20.0", "python-multipart>=0.0.6",
    "boto3>=1.35.0",
    "google-cloud-storage>=2.14.0",
    "azure-storage-blob>=12.19.0", "azure-identity>=1.15.0",
]

[project.scripts]
doc-upload-cli    = "pdf_autofillr_doc_upload.entrypoints.cli:main"
doc-upload-server = "pdf_autofillr_doc_upload.entrypoints.server:main"

[project.urls]
Homepage = "https://github.com/yourorg/pdf-autofillr-doc-upload"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_autofillr_doc_upload"]

[tool.hatch.build.targets.wheel.force-include]
"config_samples" = "pdf_autofillr_doc_upload/config_samples"

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, no I/O, no network",
    "integration: requires running server or cloud credentials",
]
