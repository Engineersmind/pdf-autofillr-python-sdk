name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'   # Every Monday 06:00 UTC

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read

    strategy:
      fail-fast: false
      matrix:
        language: [python]

    steps:
      - uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality
          paths: |
            packages/mapper/src
            packages/chatbot/src
            packages/doc_upload/src
            packages/rag/src
            packages/pdf_autofillr/src
            plugins/core
            plugins/pdf_autofillr
          paths-ignore: |
            packages/chatbot/entrypoints
            packages/doc_upload/entrypoints
            packages/mapper/entrypoints
            packages/rag/entrypoints
            examples/
            benchmarks/

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
          # Only fail on errors — warnings and notes are informational only
          fail-on: error