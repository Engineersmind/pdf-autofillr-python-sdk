name: Publish to PyPI

# Tag format → Package:
#   mapper-v1.0.11       → pdf-autofillr-mapper      (packages/mapper/)
#   chatbot-v0.3.1      → pdf-autofillr-chatbot      (packages/chatbot/)
#   doc-upload-v0.1.6   → pdf-autofillr-doc-upload   (packages/doc_upload/)
#   rag-v0.2.5          → pdf-autofillr-rag           (packages/rag/)
#   umbrella-v1.1.5     → pdf-autofillr               (packages/pdf_autofillr/)
#   core-v1.0.0         → pdf-autofiller-core         (plugins/core/)
#   plugins-v0.1.0      → pdf-autofiller-plugins      (plugins/pdf_autofillr/)
#
# Release steps:
#   1. Bump version in pyproject.toml
#   2. Update CHANGELOG.md
#   3. Merge to main
#   4. git tag mapper-v1.0.11 && git push origin mapper-v1.0.11
#
# Uses PyPI Trusted Publishing (OIDC) — no token needed.
# Set up at https://pypi.org/manage/account/publishing/

on:
  push:
    tags:
      - 'mapper-v*'
      - 'chatbot-v*'
      - 'doc-upload-v*'
      - 'rag-v*'
      - 'umbrella-v*'
      - 'core-v*'
      - 'plugins-v*'

jobs:
  resolve:
    name: Resolve package from tag
    runs-on: ubuntu-latest
    outputs:
      package_dir: ${{ steps.r.outputs.package_dir }}
      package_name: ${{ steps.r.outputs.package_name }}
      version: ${{ steps.r.outputs.version }}
    steps:
      - name: Resolve
        id: r
        run: |
          TAG="${GITHUB_REF_NAME}"
          if   [[ "$TAG" == mapper-v* ]];     then D=packages/mapper;        N=pdf-autofillr-mapper;       V=${TAG#mapper-v}
          elif [[ "$TAG" == chatbot-v* ]];    then D=packages/chatbot;       N=pdf-autofillr-chatbot;      V=${TAG#chatbot-v}
          elif [[ "$TAG" == doc-upload-v* ]]; then D=packages/doc_upload;    N=pdf-autofillr-doc-upload;   V=${TAG#doc-upload-v}
          elif [[ "$TAG" == rag-v* ]];        then D=packages/rag;           N=pdf-autofillr-rag;           V=${TAG#rag-v}
          elif [[ "$TAG" == umbrella-v* ]];   then D=packages/pdf_autofillr; N=pdf-autofillr;               V=${TAG#umbrella-v}
          elif [[ "$TAG" == core-v* ]];       then D=plugins/core;            N=pdf-autofiller-core;         V=${TAG#core-v}
          elif [[ "$TAG" == plugins-v* ]];    then D=plugins/pdf_autofillr;   N=pdf-autofiller-plugins;      V=${TAG#plugins-v}
          else echo "Unknown tag: $TAG" && exit 1; fi
          echo "package_dir=$D" >> $GITHUB_OUTPUT
          echo "package_name=$N" >> $GITHUB_OUTPUT
          echo "version=$V"      >> $GITHUB_OUTPUT

  test:
    name: Test ${{ needs.resolve.outputs.package_name }} / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    needs: resolve
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Java (mapper only)
        if: startsWith(github.ref_name, 'mapper-v')
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --tb=short -q

  build:
    name: Build ${{ needs.resolve.outputs.package_name }}
    runs-on: ubuntu-latest
    needs: [resolve, test]
    defaults:
      run:
        working-directory: ${{ needs.resolve.outputs.package_dir }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Verify version matches tag
        run: |
          PKG=$(python -c "import tomllib,pathlib; print(tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['version'])")
          echo "Tag=${{ needs.resolve.outputs.version }} pyproject=$PKG"
          [ "${{ needs.resolve.outputs.version }}" = "$PKG" ] || (echo "Version mismatch" && exit 1)
      - run: pip install build && python -m build
      - uses: actions/upload-artifact@v7
        with:
          name: dist-${{ needs.resolve.outputs.package_name }}
          path: ${{ needs.resolve.outputs.package_dir }}/dist/

  publish:
    name: Publish ${{ needs.resolve.outputs.package_name }}
    runs-on: ubuntu-latest
    needs: [resolve, build]
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist-${{ needs.resolve.outputs.package_name }}
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/