name: Tests

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]

jobs:
  mapper:
    name: mapper / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/mapper
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --tb=short --cov=src/pdf_autofillr_mapper --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: mapper-coverage-py${{ matrix.python-version }}
          path: packages/mapper/coverage.xml

  chatbot:
    name: chatbot / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/chatbot
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --tb=short --cov=src/chatbot --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: chatbot-coverage-py${{ matrix.python-version }}
          path: packages/chatbot/coverage.xml

  doc-upload:
    name: doc_upload / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/doc_upload
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/ --tb=short --cov=src/pdf_autofillr_doc_upload --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: doc-upload-coverage-py${{ matrix.python-version }}
          path: packages/doc_upload/coverage.xml

  rag:
    name: rag / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    defaults:
      run:
        working-directory: packages/rag
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev]"
      - run: pytest tests/unit/ --tb=short --cov=src/ragpdf --cov-report=xml -q
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: rag-coverage-py${{ matrix.python-version }}
          path: packages/rag/coverage.xml